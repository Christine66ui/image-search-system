<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品图片检索系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .upload-section {
            padding: 40px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            padding: 0 40px 40px;
            display: none;
        }

        .preview-image {
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 20px auto;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-section {
            padding: 0 40px 40px;
            display: none;
        }

        .results-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-results-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .result-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f5f5f5;
            padding: 10px;
        }

        .result-info {
            padding: 20px;
        }

        .product-id {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .product-category {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .similarity-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
        }

        .similarity-text {
            font-size: 14px;
            color: #667eea;
            margin-top: 8px;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 25px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 产品图片检索系统</h1>
            <p>上传产品图片，自动匹配产品图库并返回款号</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*">
                <div class="upload-icon">📷</div>
                <div class="upload-text">点击或拖拽上传产品图片</div>
                <div class="upload-hint">支持 JPG、PNG 格式</div>
            </div>

            <div class="preview-section" id="previewSection">
                <img id="previewImage" class="preview-image" alt="预览图">
                <div>
                    <button class="search-btn" id="searchBtn">开始检索</button>
                    <button class="clear-btn" id="clearBtn">重新上传</button>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在检索中，请稍候...</p>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <h2 class="results-title">检索结果</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        let uploadedFile = null;

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', handleFileSelect);

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            uploadedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                uploadArea.style.display = 'none';
                previewSection.style.display = 'block';
                resultsSection.style.display = 'none';
                hideError();
            };
            reader.readAsDataURL(file);
        }

        // 检索按钮
        searchBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;

            const formData = new FormData();
            formData.append('image', uploadedFile);

            loading.style.display = 'block';
            resultsSection.style.display = 'none';
            searchBtn.disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.found) {
                    displayResults(data.results);
                } else {
                    displayNoResults();
                }
            } catch (error) {
                showError('检索失败：' + error.message);
            } finally {
                loading.style.display = 'none';
                searchBtn.disabled = false;
            }
        });

        // 清除按钮
        clearBtn.addEventListener('click', () => {
            uploadedFile = null;
            fileInput.value = '';
            previewImage.src = '';
            uploadArea.style.display = 'block';
            previewSection.style.display = 'none';
            resultsSection.style.display = 'none';
            hideError();
        });

        function displayResults(results) {
            resultsGrid.innerHTML = results.map(item => {
                // 对路径进行URL编码以支持中文路径
                const encodedPath = item.path.split('/').map(encodeURIComponent).join('/');
                return `
                <div class="result-card">
                    <img class="result-image" src="${encodedPath}" alt="${item.product_id}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23f5f5f5%22 width=%22200%22 height=%22200%22/><text fill=%22%23999%22 x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>图片加载失败</text></svg>'">
                    <div class="result-info">
                        <div class="product-id">款号：${item.product_id}</div>
                        <div class="product-category">类别：${item.category}</div>
                        <div class="similarity-bar">
                            <div class="similarity-fill" style="width: ${item.similarity * 100}%"></div>
                        </div>
                        <div class="similarity-text">相似度：${(item.similarity * 100).toFixed(1)}%</div>
                    </div>
                </div>
            `}).join('');

            resultsSection.style.display = 'block';
        }

        function displayNoResults() {
            resultsGrid.innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">🤷</div>
                    <p>${document.querySelector('.results-title').dataset.message || '未找到相似的产品'}</p>
                    <p style="margin-top: 10px; font-size: 14px;">请尝试上传更清晰或角度更接近的图片</p>
                </div>
            `;
            resultsSection.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
